version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: study_t2_pgvector
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-study_t2_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-study_t2_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./prototype/api
      dockerfile: Dockerfile
    container_name: study_t2_api
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./prototype/api:/app
      - ./.env:/app/.env

volumes:
  pgdata:

